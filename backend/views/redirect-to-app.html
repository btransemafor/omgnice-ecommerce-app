<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Opening App...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      background: #f5f6fa;
      color: #2d3436;
    }
    a {
      margin-top: 20px;
      color: #0984e3;
      font-weight: bold;
      font-size: 1.1rem;
    }
  </style>
  <script>
    // Attempt to open the app
    window.onload = function () {
      window.location.href = "omgniceapp://omgnice.com/home";

      // Fallback after 2s
      setTimeout(function () {
        window.location.href = "https://play.google.com/store/apps/details?id=com.example.omgnice_app_tv";
      }, 2000);
    };
  </script>
</head>
<body>
  <h2>Đang mở ứng dụng OMGNICE...</h2>
  <p>Nếu không được chuyển hướng tự động:</p>
  <a href="omgniceapp://home">Bấm vào đây để mở ứng dụng</a>
</body>
</html>
