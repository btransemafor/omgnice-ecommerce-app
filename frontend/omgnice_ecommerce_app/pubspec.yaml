name: omgnice_ecommerce_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.6.2
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  firebase_core: ^3.12.1
  google_sign_in: ^6.3.0
  firebase_auth: ^5.5.1
  provider: ^6.1.2
  cloud_firestore: ^5.6.5
  flutter_bloc: ^9.1.0
  go_router: ^14.8.1
  dio: ^5.3.2
  shared_preferences: ^2.5.2
  google_fonts: ^6.2.1
  pinput: ^5.0.1
  another_flushbar: ^1.12.30
  lottie: ^3.3.1
  carousel_slider: ^5.0.0
  image_picker: ^1.1.2
  path: ^1.8.3
  firebase_storage: ^12.4.4
  shimmer: ^3.0.0
  animated_custom_dropdown: ^3.1.1
  font_awesome_flutter: ^10.8.0
  dropdown_button2: ^2.3.9
  expandable_text: ^2.3.0
  flutter_slidable: ^4.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  video_player: ^2.9.5
  animations: ^2.0.0
  google_maps_flutter: ^2.12.1
  logger: ^2.4.0  # for logging purpose
  json_annotation: ^4.9.0
  flutter_secure_storage: ^9.2.4
  get_it: ^8.0.3
  zalo_flutter: ^0.0.8
  fl_chart: ^0.71.0
  url_launcher: ^6.2.4
  webview_flutter: ^4.10.0 
  image_cropper: ^9.1.0
  flutter_spinkit: ^5.2.1
  liquid_pull_to_refresh: ^3.0.1
  app_links: ^6.4.0
  file_picker: ^10.1.9
  http: ^1.4.0
  easy_localization: ^3.0.7+1
  animate_do: ^3.0.2
  pull_to_refresh: ^2.0.0
  timeago: ^3.7.1
  flutter_fortune_wheel: ^1.3.1
  flutter_markdown: ^0.7.3
  flutter_animate: ^4.5.2
  clipboard: ^0.1.3







dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0
  hive_generator: 2.0.1
  build_runner: ^2.3.3
  flutter_native_splash: ^2.4.1
  
flutter_native_splash:
  color: "#4CAF50" # Green background to match your theme
  image: assets/icons/splash_logo.png # Your splash image
  android: true
  ios: true
  android_12:
    image: assets/icons/splash_logo.png
    color: "#4CAF50"
  fullscreen: true
 
# For information on the generic Dart part of this file, see the
